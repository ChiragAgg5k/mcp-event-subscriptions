[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-event-subscriptions"
version = "0.1.0a1"
description = "Experimental portable MCP webhook subscription records and JWE envelopes"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["jsonschema>=4.23,<5", "jwcrypto>=1.5.6,<2"]

[project.urls]
Repository = "https://github.com/appwrite/mcp-event-subscriptions"

[dependency-groups]
dev = ["black>=24", "ruff>=0.11"]

[tool.hatch.build.targets.wheel]
packages = ["packages/python/src/mcp_event_subscriptions"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
